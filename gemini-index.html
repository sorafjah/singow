<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歩行者信号機アプリ</title>
    <style>
        :root {
            --bg-color: #87CEEB; /* 空色 */
            --signal-bg: #e0e0e0;
            --light-off: #1a1a1a;
            --light-red: #ff3333;
            --light-green: #00ffcc;
            --ui-color: #555;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- 設定画面 --- */
        #settings-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #333;
            background-color: #f0f8ff;
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
        }

        h1 { 
            font-size: 2rem; 
            margin-bottom: 2rem; 
            color: #007bff;
        }

        .setting-group {
            margin-bottom: 1.5rem;
            width: 80%;
            max-width: 400px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .setting-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            color: #555;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .num-btn {
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            border: 2px solid #ddd;
            border-radius: 50%;
            background-color: #fff;
            color: #333;
            cursor: pointer;
            transition: 0.2s;
        }
        .num-btn:active { background-color: #eee; }

        input[type="number"] {
            width: 80px;
            height: 50px;
            font-size: 1.5rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #333;
        }

        /* モード切替スイッチ */
        .mode-switch {
            display: flex;
            background: #e0e0e0;
            border-radius: 30px;
            padding: 5px;
            margin-bottom: 2rem;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .mode-btn {
            padding: 10px 30px;
            border: none;
            background: transparent;
            color: #777;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 25px;
            transition: 0.3s;
        }

        .mode-btn.active {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        #start-btn {
            padding: 15px 60px;
            font-size: 1.5rem;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.96); }

        /* --- 表示画面（信号機） --- */
        #display-screen {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* 信号機本体 */
        .signal-box {
            background-color: var(--signal-bg);
            border-radius: 40px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            height: 85vh;
            width: auto;
            aspect-ratio: 1 / 2.2;
        }

        .light-container {
            flex: 1;
            background-color: #000;
            border-radius: 30px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-top: 6px solid #666;
        }

        /* SVGアイコンの設定 */
        .signal-icon {
            width: 90%;
            height: 90%;
            opacity: 0.15;
            transition: opacity 0.1s;
        }
        
        .light-container.red-active .signal-icon {
            fill: var(--light-red);
            opacity: 1;
            filter: drop-shadow(0 0 15px var(--light-red));
        }

        .light-container.green-active .signal-icon {
            fill: var(--light-green);
            opacity: 1;
            filter: drop-shadow(0 0 15px var(--light-green));
        }

        /* --- 隠しコントロールボタン（修正：背景の丸を削除） --- */
        .control-btn {
            position: absolute;
            bottom: 20px;
            width: 60px;
            height: 60px;
            background: transparent; /* 背景透明 */
            border: none;
            color: rgba(0, 0, 0, 0.2); /* 薄いグレー */
            font-size: 30px; /* アイコンを少し大きく */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
            z-index: 100;
            /* タップしやすいように透明な領域としてのサイズ(width/height)は維持 */
        }

        .control-btn:hover, .control-btn:active {
            background: transparent;
            color: rgba(0, 0, 0, 0.5); /* ホバー時に少し濃く */
        }

        #settings-btn { left: 20px; }
        #manual-next-btn { right: 20px; display: none; }

    </style>
</head>
<body>

    <!-- 設定画面 -->
    <div id="settings-screen">
        <h1>信号機の設定</h1>

        <div class="mode-switch">
            <button class="mode-btn active" id="mode-auto" onclick="setMode('auto')">自動</button>
            <button class="mode-btn" id="mode-manual" onclick="setMode('manual')">手動</button>
        </div>

        <div class="setting-group">
            <label class="setting-label">赤信号の時間 (秒)</label>
            <div class="input-wrapper">
                <button class="num-btn" onclick="adjustValue('red-duration', -1)">-</button>
                <input type="number" id="red-duration" value="5" min="1">
                <button class="num-btn" onclick="adjustValue('red-duration', 1)">+</button>
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-label">青信号の時間 (秒)</label>
            <div class="input-wrapper">
                <button class="num-btn" onclick="adjustValue('green-duration', -1)">-</button>
                <input type="number" id="green-duration" value="5" min="1">
                <button class="num-btn" onclick="adjustValue('green-duration', 1)">+</button>
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-label">青点滅の時間 (秒)</label>
            <div class="input-wrapper">
                <button class="num-btn" onclick="adjustValue('blink-duration', -1)">-</button>
                <input type="number" id="blink-duration" value="3" min="1">
                <button class="num-btn" onclick="adjustValue('blink-duration', 1)">+</button>
            </div>
        </div>

        <button id="start-btn" onclick="startApp()">スタート</button>
    </div>

    <!-- 信号機表示画面 -->
    <div id="display-screen">
        <div class="signal-box">
            <!-- 赤信号（上の窓） -->
            <div class="light-container" id="red-light">
                <!-- 止まれの人 SVG -->
                <svg class="signal-icon" viewBox="0 0 100 200" fill="#333">
                    <!-- 帽子 -->
                    <path d="M35,25 L65,25 L70,30 L30,30 Z" /> 
                    <path d="M40,15 L60,15 L60,25 L40,25 Z" />
                    <!-- 頭 -->
                    <circle cx="50" cy="45" r="12" />
                    <!-- 体 -->
                    <rect x="35" y="60" width="30" height="60" rx="5" />
                    <!-- 腕 -->
                    <rect x="25" y="60" width="10" height="50" rx="5" />
                    <rect x="65" y="60" width="10" height="50" rx="5" />
                    <!-- 足 -->
                    <rect x="38" y="120" width="10" height="50" rx="5" />
                    <rect x="52" y="120" width="10" height="50" rx="5" />
                </svg>
            </div>

            <!-- 青信号（下の窓） -->
            <div class="light-container" id="green-light">
                <!-- 進めの人 SVG -->
                <svg class="signal-icon" viewBox="0 0 100 200" fill="#333">
                    <!-- 帽子 -->
                    <path d="M40,25 L70,25 L75,30 L35,30 Z" /> 
                    <path d="M45,15 L65,15 L65,25 L45,25 Z" />
                    <!-- 頭 -->
                    <circle cx="55" cy="45" r="12" />
                    <!-- 体 -->
                    <path d="M45,60 L70,60 L65,110 L40,110 Z" />
                    
                    <!-- 腕 -->
                    <path d="M45,65 L20,95 L25,100 L50,70 Z" /> 
                    <path d="M65,65 L90,95 L85,100 L60,70 Z" /> 
                    
                    <!-- 足 -->
                    <path d="M45,110 L25,160 L35,165 L55,115 Z" />
                    <path d="M60,110 L80,160 L70,165 L50,115 Z" />
                </svg>
            </div>
        </div>

        <!-- 隠しコントロール -->
        <button id="settings-btn" class="control-btn" onclick="stopApp()">⚙️</button>
        <button id="manual-next-btn" class="control-btn" onclick="manualNext()">▷</button>
    </div>

    <script>
        // 設定値
        let redDuration = 5000;
        let greenDuration = 5000;
        let blinkDuration = 3000;
        let currentMode = 'auto';
        
        // 状態管理
        let currentState = 'RED'; 
        let timerId = null;
        let blinkIntervalId = null;

        // DOM要素
        const redLight = document.getElementById('red-light');
        const greenLight = document.getElementById('green-light');
        const manualNextBtn = document.getElementById('manual-next-btn');

        // モード設定
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-auto').classList.toggle('active', mode === 'auto');
            document.getElementById('mode-manual').classList.toggle('active', mode === 'manual');
        }

        // 数値調整ボタン
        function adjustValue(id, amount) {
            const input = document.getElementById(id);
            let val = parseInt(input.value) + amount;
            if (val < 1) val = 1;
            input.value = val;
        }

        // アプリ開始
        function startApp() {
            // 設定値の読み込み
            redDuration = parseInt(document.getElementById('red-duration').value) * 1000;
            greenDuration = parseInt(document.getElementById('green-duration').value) * 1000;
            blinkDuration = parseInt(document.getElementById('blink-duration').value) * 1000;

            // 画面切り替え
            document.getElementById('settings-screen').style.display = 'none';
            document.getElementById('display-screen').style.display = 'flex';

            // 手動ボタンの表示切替
            manualNextBtn.style.display = currentMode === 'manual' ? 'flex' : 'none';

            // 開始状態
            changeState('RED');
        }

        // アプリ終了
        function stopApp() {
            clearTimers();
            document.getElementById('display-screen').style.display = 'none';
            document.getElementById('settings-screen').style.display = 'flex';
        }

        function clearTimers() {
            if (timerId) clearTimeout(timerId);
            if (blinkIntervalId) clearInterval(blinkIntervalId);
            redLight.classList.remove('red-active');
            greenLight.classList.remove('green-active');
            greenLight.style.opacity = '';
        }

        // 状態遷移ロジック
        function changeState(newState) {
            clearTimers();
            currentState = newState;

            if (newState === 'RED') {
                redLight.classList.add('red-active');
                
                if (currentMode === 'auto') {
                    timerId = setTimeout(() => changeState('GREEN'), redDuration);
                }

            } else if (newState === 'GREEN') {
                greenLight.classList.add('green-active');

                if (currentMode === 'auto') {
                    timerId = setTimeout(() => changeState('BLINK_GREEN'), greenDuration);
                }

            } else if (newState === 'BLINK_GREEN') {
                let isVisible = true;
                const blinkSpeed = 500;
                let elapsed = 0;

                const doBlink = () => {
                    isVisible = !isVisible;
                    if (isVisible) {
                        greenLight.classList.add('green-active');
                    } else {
                        greenLight.classList.remove('green-active');
                    }
                };

                greenLight.classList.add('green-active');
                
                blinkIntervalId = setInterval(() => {
                    doBlink();
                    elapsed += blinkSpeed;

                    if (currentMode === 'auto' && elapsed >= blinkDuration) {
                        changeState('RED');
                    }
                }, blinkSpeed);
            }
        }

        // 手動送りボタン
        function manualNext() {
            if (currentState === 'RED') {
                changeState('GREEN');
            } else if (currentState === 'GREEN') {
                changeState('BLINK_GREEN');
            } else if (currentState === 'BLINK_GREEN') {
                changeState('RED');
            }
        }
    </script>
</body>
</html>
